name: apple_pencil_double_tap
description: Flutter Apple Pencil double-tap and squeeze events on compatible iPads, with iPhone Duo compatibility and hardware-specific gesture availability.
version: 2.0.0
repository: https://github.com/Code-Growers/apple_pencil_double_tap
issue_tracker: https://github.com/Code-Growers/apple_pencil_double_tap/issues
homepage: https://codegrowers.tech
topics:
  - apple-pencil
  - ipad
  - iphone-duo
  - stylus
  - gestures

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ApplePencilDoubleTapPlugin
        swiftPackageManager:
          path: ios/apple_pencil_double_tap/
